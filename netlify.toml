# Netlify builds the Next.js app in frontend/ (the repo root has no package.json, which is why a default build
# publishes nothing and shows "Page not found"). Netlify detects Next.js and installs its runtime automatically.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node 20 is deprecated by supabase-js; the app needs 20.9 or later.
  NODE_VERSION = "22"

# Attach Netlify's Next.js runtime explicitly instead of relying on auto-detection. Every page of this app is rendered on
# demand (server-side), so without the runtime Netlify publishes no pages and every address answers "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
